services:
  actual:
    build:
      context: .
      dockerfile: Dockerfile
    image: actualbudget-app
    environment:
      ACTUAL_PORT: ${ACTUAL_PORT:-5006}
      ACTUAL_BACKUP_BUCKET: ${ACTUAL_BACKUP_BUCKET:-}
      ACTUAL_BACKUP_PREFIX: ${ACTUAL_BACKUP_PREFIX:-}
      ACTUAL_BACKUP_INTERVAL_SECONDS: ${ACTUAL_BACKUP_INTERVAL_SECONDS:-3600}
    ports:
      - '${ACTUAL_PORT:-5006}:5006'
    volumes:
      - './data:/data'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', 'build/scripts/health-check.js']
      interval: 30s
      timeout: 5s
      retries: 3
